const app=document.querySelector('#app');const stages=['職群認識','科別認識','先備知識','技能挑戰','生涯反思'];let cfg,db,auth,api,uid,teacher=false,cls='',seat='',locks={},records={},mine={},stop=[],view=()=>{};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);const key=(g,k)=>g+'_'+k;const fail=e=>alert(e.message||e);function draw(fn){view=fn;fn()}function home(){app.innerHTML=`<article><h2>🎮 玩家登入</h2><p>輸入班級與座號，開始你的職群冒險。</p><input id="cl" placeholder="班級 901"><input id="no" placeholder="座號 1–40"><button id="student">登入</button><h2>🛡️ GM 教師登入</h2><input id="email" type="email" placeholder="教師電子郵件"><input id="pw" type="password" placeholder="密碼"><button id="teach">登入教師控台</button><p>使用 Firebase 即時同步。班級座號為學生自填識別資料。</p></article>`;$('student').onclick=async()=>{try{cls=$('cl').value.trim();seat=+$('no').value;if(!/^[1-9]\d{2}$/.test(cls)||!Number.isInteger(seat)||seat<1||seat>40)throw Error('請確認班級座號');await api.signInAnonymously(auth);uid=auth.currentUser.uid;teacher=false;await api.set(api.ref(db,`careerStudents/${cls}/${uid}/seat`),seat);listen();draw(map)}catch(e){fail(e)}};$('teach').onclick=async()=>{try{await api.signInWithEmailAndPassword(auth,$('email').value,$('pw').value);uid=auth.currentUser.uid;if(!(await api.get(api.ref(db,'careerTeachers/'+uid))).val())throw Error('此帳號未授權為教師');teacher=true;cls='901';listen();draw(admin)}catch(e){fail(e)}}}function listen(){stop.forEach(f=>f());stop=[api.onValue(api.ref(db,'careerLocks/'+cls),s=>{locks=s.val()||{};view()}),api.onValue(api.ref(db,teacher?'careerStudents/'+cls:`careerStudents/${cls}/${uid}`),s=>{if(teacher)records=s.val()||{};else mine=s.val()?.progress||{};view()})]}function logout(){stop.forEach(f=>f());stop=[];api.signOut(auth);draw(home)}function map(){app.innerHTML=`<button id="out">登出</button><h2>🗺️ ${cls} 班 ${seat} 號｜探索地圖</h2><div class="hud"><b>LV. ${1+Math.floor(Object.values(mine).filter(x=>x.done).length/5)}</b> </article>`).join('');b.querySelectorAll('[data-n]').forEach(t=>t.onclick=async()=>{try{let n=+t.dataset.n,z=+t.dataset.z,old=r.answers?.[n],correct=z===n%2,answers={...r.answers,[n]:{correct,first:old?old.first:correct,attempts:(old?.attempts||0)+1}};await write(g,k,{answers,done:d[4].every((_,i)=>answers[i]?.correct)})}catch(e){fail(e)}})}if(k===4){b.innerHTML=`<label>最想探索科別<select id="fav">${d[4].map(x=>`<option ${r.fav===x[0]?'selected':''}>${x[0]}</option>`).join('')}</select></label><label>興趣 1–5<input id="interest" type="number" min="1" max="5" value="${r.interest||3}"></label><label>想培養的能力<input id="reflect" value="${esc(r.reflect)}"></label><button id="save">儲存反思</button>`;$('save').onclick=()=>{let v=+$('interest').value;if(!Number.isInteger(v)||v<1||v>5||!$('reflect').value.trim())return alert('請完成反思');write(g,k,{done:true,fav:$('fav').value,interest:v,reflect:$('reflect').value}).then(()=>draw(map)).catch(fail)}}}function summary(r){let p=Object.values(r.progress||{}),a=p.flatMap(x=>Object.values(x.answers||{}));return [p.filter(x=>x.done).length,a.length,a.filter(x=>x.first).length,a.reduce((s,x)=>s+x.attempts,0)]}function admin(){app.innerHTML=`<button id="out">登出</button><h2>🛡️ GM 任務指揮中心</h2><input id="class" value="${esc(cls)}"><button id="switch">切換班級</button><button id="all">全部開放</button><button id="none">全部鎖定</button><div class="grid">${data.map((d,g)=>`<article><h3>${d[0]}</h3>${stages.map((s,k)=>`<button data-key="${key(g,k)}">${locks[key(g,k)]?'🔓':'🔒'} ${s}</button>`).join('')}</article>`).join('')}</div><article><h2>學習成效｜${Object.keys(records).length} 筆登入紀錄</h2><button id="csv">匯出 CSV</button>${Object.entries(records).map(([id,r])=>{let [done,n,c,a]=summary(r);return `<details><summary>${esc(r.seat)}號｜完成 ${done}/75｜首次正確率 ${n?Math.round(c/n*100)+'%':'—'}｜作答 ${a} 次</summary>${data.map((d,g)=>{let x=r.progress?.[key(g,3)]||{},y=r.progress?.[key(g,4)]||{};return `<p>${d[0]}：${Object.values(x.answers||{}).filter(a=>a.correct).length}/${d[4].length} 答對；興趣 ${esc(y.interest||'—')}；${esc(y.fav)} ${esc(y.reflect)}</p>`}).join('')}</details>`}).join('')}</article>`;$('out').onclick=logout;$('switch').onclick=()=>{let c=$('class').value;if(!/^[1-9]\d{2}$/.test(c))return alert('班級格式錯誤');cls=c;locks={};records={};listen();admin()};app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>api.set(api.ref(db,'careerLocks/'+cls+'/'+b.dataset.key),!locks[b.dataset.key]).catch(fail));$('all').onclick=()=>api.set(api.ref(db,'careerLocks/'+cls),Object.fromEntries(data.flatMap((_,g)=>stages.map((_,k)=>[key(g,k),true])))).catch(fail);$('none').onclick=()=>api.set(api.ref(db,'careerLocks/'+cls),{}).catch(fail);$('csv').onclick=()=>{let rows=[['班級','座號','完成關卡','已答題數','首次答對','作答次數'],...Object.values(records).map(r=>[cls,r.seat,...summary(r)])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='learning.csv';a.click()}}async function start(){try{cfg={"apiKey": "AIzaSyBuS8SCRXENWlgTE74KAmZbB4ybvtzIyKg", "authDomain": "pathway-class-115.firebaseapp.com", "databaseURL": "https://pathway-class-115-default-rtdb.firebaseio.com", "projectId": "pathway-class-115", "storageBucket": "pathway-class-115.firebasestorage.app", "messagingSenderId": "482577409031", "appId": "1:482577409031:web:3d83b95f2b8c1d0e7df6a2", "measurementId": "G-7NCFXGD198"};if(!cfg){app.innerHTML='<article><h2>首次設定 Firebase</h2><p>貼上 Firebase 網頁設定 JSON（需包含 databaseURL）。每台裝置首次設定一次，正式發布可將設定寫入檔案。</p><textarea id="cfg" rows="9" style="width:100%"></textarea><button id="go">儲存設定</button></article>';$('go').onclick=()=>{try{localStorage.setItem('careerFirebase',JSON.stringify(JSON.parse($('cfg').value)));location.reload()}catch(e){fail(e)}};return}let [a,b,c]=await Promise.all(['app','auth','database'].map(x=>import('https://www.gstatic.com/firebasejs/11.10.0/firebase-'+x+'.js')));api={...b,...c};let f=a.initializeApp(cfg);auth=b.getAuth(f);db=c.getDatabase(f);draw(home)}catch(
